name: assured

services:
  postgres:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assured}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-user.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-assured}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    deploy:
      resources:
        limits:
          memory: 512M
    # PostgreSQL is not published to the host or public internet.

  migrate:
    image: ${APP_IMAGE:-assured-web:local}
    restart: "no"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_MIGRATE_URL}
      DATABASE_MIGRATE_URL: ${DATABASE_MIGRATE_URL}
      APP_DB_USER: ${APP_DB_USER}
    command: ["node", "migrate.cjs"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    profiles:
      - tools

  app:
    image: ${APP_IMAGE:-assured-web:local}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 768M
    read_only: false
    security_opt:
      - no-new-privileges:true

  worker:
    image: ${APP_IMAGE:-assured-web:local}
    restart: unless-stopped
    command: ["node", "worker.cjs"]
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  backup:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-assured}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    volumes:
      - ./scripts:/scripts:ro
      - backup_local:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_local:
